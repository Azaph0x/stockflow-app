<div class="list-wrapper">
  <ion-segment [(ngModel)]="segment">
    <ion-segment-button value="products">
      <ion-label>Produtos</ion-label>
    </ion-segment-button>
    <ion-segment-button value="movement">
      <ion-label>Movimentações</ion-label>
    </ion-segment-button>

  </ion-segment>

  <div class="items">
    @if (segment == "products") {
      @if (products$ | async; as products) {
        @for (product of products; track $index) { <item-product [product]="product" /> }
      } @else {
        <item-product-skeleton *ngFor="let item of [].constructor(5)" />
      }
    } @else {
      @if (movements$ | async; as movements) {
        @for (movement of movements; track $index) { <item-movement [movement]="movement" /> }
      } @else {
        <item-movement-skeleton *ngFor="let item of [].constructor(5)" />
      }
    }
  </div>

</div>
